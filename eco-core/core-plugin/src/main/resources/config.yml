#
# eco
# by Auxilor
# Default config (With Comments) can be found here: https://github.com/Auxilor/eco/blob/master/eco-core/core-plugin/src/main/resources/config.yml
#

# How player/server data is saved:
# sqlite - Stored in data.db: the default, and the right choice for single-node servers (i.e. no BungeeCord/Velocity)
# mysql/mariadb - Standard database, great option for multi-node servers (i.e. BungeeCord/Velocity)
# mongodb - Alternative database, great option for multi-node servers (i.e. BungeeCord/Velocity)
data-handler: sqlite

# If data should be migrated automatically when changing data handler.
perform-data-migration: true

mongodb:
  # The full MongoDB connection URL.
  url: ""

  # The name of the database to use.
  database: eco

  # The collection to use for player data.
  collection: profiles

mysql:
  # The table prefix to use for all tables.
  prefix: "eco_"

  # The maximum number of MySQL connections.
  connections: 10

  # Connection details for MySQL.
  host: localhost
  port: 3306
  database: database
  user: username
  password: p4ssw0rd

sqlite:
  # The name of the database file, stored in the eco plugin folder.
  file: data.db

  # The table prefix to use for all tables.
  prefix: "eco_"

# How many ticks to wait between committing data to the data handler. By default, data is
# committed every tick, but you can increase this to be every x ticks, for example 20
# would be committing once a second.
save-interval: 1

# How many ticks to wait between autosaves of data.yml, which no longer holds player data
# but still holds eco's own bookkeeping.
autosave-interval: 36000 # 30 minutes

# Options to manage the conflict finder
conflicts:
  whitelist: # Plugins that should never be marked as conflicts
    - eco

# DropQueue by default uses a faster collated queue system where all drops
# that originate from the same player on the same tick are dropped together.
# Disable it if it changes drop mechanics too much for you.
use-fast-collated-drops: true

# Controls how eco handles italics on custom item names/lore.
# false (default): every name/lore line is forced non-italic.
#   Safe choice if your plugins/lore weren't written with vanilla italics in mind.
# true: matches vanilla exactly. Only colored/formatted lines get italics forced off; plain
#   lines are left alone, so plain lore renders italic like vanilla lore normally does, and
#   anvil-renamed items behave like vanilla. Turn this on if you rely on custom_name-based
#   resource packs, or want correct vanilla behavior over legacy compatibility.
use-vanilla-item-name-format: false

# How eco removes its own client-side lore lines when reverting an item.
# false (default): display lines are matched on the components themselves, by the shape eco
#   writes them in. Lore added by other plugins is left untouched, including lines that start
#   with the same prefix eco uses (AdvancedEnchantments writes its enchantment descriptions
#   this way).
# true: every line starting with eco's prefix is removed, and the whole lore is round-tripped
#   through legacy text. This is how eco used to work. It deletes other plugins' lore lines
#   that share eco's prefix, and discards anything legacy text can't represent (translatable
#   lines, fonts, hover and click events, sprites). Only enable this if you relied on the old
#   behavior.
use-legacy-lore-revert: false

# Display frames massively optimize PacketWindowItems, however some users have
# reported display bugs by using it. If you have any problems with it, then you
# should disable this option.
use-display-frame: true

# Time to live for a display frame. In other words, this is how frequent (in ticks)
# that display frames will be cleared / deleted.
display-frame-ttl: 17

# If the stack traces of extensions that failed to load should be logged. Disabled by
# default to prevent users from reporting bugs. Enable if you're a developer.
log-full-extension-errors: false

# To make the custom crafting system work better for players, players are also sent an
# additional recipe containing the displayed items as ingredients. However, with a large
# number of recipes, this can create PacketTooLargeExceptions. If you have this exception,
# disable this option. Bear in mind that this means the auto-craft preview will fail to
# render items nicely, which may degrade the user experience on your server. If you use
# a custom crafting table, though, this won't affect anything, and you should disable the option.
displayed-recipes: true

# If the server should be shut down when a plugin requires a newer version of eco than the
# one that is installed. Those plugins fail to load, so their items and data are left
# unregistered for the whole session, which can cause other plugins to strip or delete them.
# The server is shut down cleanly, after worlds have loaded, and players are kept out until
# then. Turn this off to start the server anyway.
shutdown-on-outdated-plugin: true

# If eco plugins should not check for updates; only enable this if you know what you're doing
# as there can be urgent hotfixes that you are then not notified about. If you're confident
# that you can manage updates on your own, turn this on.
no-update-checker: false

# The time (in milliseconds) for math expression results to be cached for. Higher values will lead to
# faster evaluation times (less CPU usage) at the expense of slightly more memory usage and
# less reactive values.
math-cache-ttl: 200

# The time (in minutes) for literal patterns to be cached for. Higher values will lead to
# faster evaluation times (less CPU usage) at the expense of slightly more memory usage and
# less reactive values. (Do not change unless you are told to).
literal-cache-ttl: 10

# If anonymous usage statistics should be tracked. This is very valuable information as it
# helps understand how eco and other plugins are being used by logging player and server
# counts. This is completely anonymous and no personal information is logged. This data
# is primarily used for optimisation and server insights.
playerflow: true

# Options for the {#{expression}} progress bar placeholder syntax.
progress-bar:
  # The character used to draw each section of the bar.
  character: "|"

  # The number of sections in the bar.
  bars: 10

  # The color/format applied to completed sections.
  complete-format: "&a"

  # The color/format applied to the in-progress section.
  in-progress-format: "&a"

  # The color/format applied to incomplete sections.
  incomplete-format: "&7"

# If the packet display system should activate on items that have no meta. This is disabled
# by default for performance reasons, but if you want to use the packet display system on
# items that have no meta, then you can enable this option.
display-without-meta: false

# If eco should enforce its recipes against other plugins. Turn this on if use custom items from
# non eco-based plugins in recipes and are encountering issues with invisible items or similar.
# This may cause issues with other plugins, so only enable this if you're having issues.
enforce-preparing-recipes: false

# If enabled, eco will save the health of players when they log out and restore it when they log back in
# as a workaround for player health being reset to 20 on login.
enable-health-fix: true

# The duration (in seconds) during which the health fix will be applied
# Requires enable-health-fix to be true.
health-fix-duration: 3

# The interval (in seconds) at which the health fix will be applied during the duration
health-fix-interval: 1

kill-attribution:
  # If a player should be credited for a kill they didn't land the final blow
  # on, such as one finished by fire, lightning, or poison. Leave this false to
  # only credit a blow that was lethal at the moment it landed.
  credit-indirect-kills: false

  # How many ticks after a player damages an entity that entity's death is
  # still credited to them. Only used when credit-indirect-kills is true.
  # Fire ticks land 20 ticks apart, so lower values will miss burn kills.
  window-ticks: 100

datapacks:
  # If datapacks belonging to plugins that are no longer installed should be
  # deleted on startup. This is the admin override for eco's removal policy:
  # eco normally refuses to remove datapack content that a loaded world has
  # already seen, because chunks can reference biome, dimension or damage type
  # IDs that would then no longer resolve.
  #
  # WARNING: enabling this can permanently break existing worlds. Only turn it
  # on if you know the removed content was never generated with, and take a
  # backup first.
  remove-orphaned: false

# Leaderboards are built asynchronously, on a schedule, and read from a snapshot.
# Reading a leaderboard never blocks the server, whatever these values are set to;
# they only control how fresh the numbers are and how much memory the snapshots use.
leaderboards:
  # Set to false to disable every leaderboard on the server. Reads then return
  # nothing, and no scan is ever performed.
  enabled: true

  # How often to re-sort leaderboards whose values changed, in seconds.
  # Sorting is CPU-only - it reads nothing from the database - so this can be far lower
  # than the reconcile interval. Values changed on this server land in memory the moment
  # they are written, so this is how quickly a rank updates after a player earns something.
  # Do not set it very low on a server with many leaderboards: a sort tick that fires
  # faster than the sorts complete will queue behind itself.
  sort-interval: 5

  # How often to re-read every value from the database, in seconds.
  # Only needed when something other than this server writes to the same database - another
  # server sharing it, or manual SQL. Values changed on this server are picked up
  # immediately and never wait for this.
  # Set to 0 to disable entirely on a single-server setup. The startup load still happens.
  reconcile-interval: 3600

  # The most players that may be written during one reconcile before its results are thrown
  # away as superseded. A reconcile that overlaps this many writes is rebuilding from a
  # database read that is already too stale to be worth merging, and the next one catches up.
  max-reconcile-overlay: 10000

  # Deprecated: renamed to reconcile-interval, which is honoured instead when it is present.
  # Left here so an existing config keeps working without being edited.
  refresh-interval: 60

  # Wait this many seconds after startup before the first rebuild. Kept short: until the
  # first rebuild completes, leaderboards rank nobody and placeholders show the same text
  # they show for an unranked player.
  initial-delay: 1

  # How many ranked entries to keep per leaderboard, or -1 for no limit.
  # -1 matches the previous behaviour, where the whole sorted list was kept and %top_N%
  # worked for any N. Every player's own rank stays available either way, since ranks are
  # tracked separately from entries.
  max-entries: -1

  # Whether %..._top_<N>_name% shows a player's saved display name - their nickname, as
  # whatever plugin sets it last stored it - rather than their account name. Both are read
  # from the eco profile, so an offline player still has a name to show either way.
  use-display-names: true

  # Ranks up to and including this are shown exactly; beyond it, a percentile band is
  # shown instead ("top 12.5%"). Defaults to 0 - always exact - because that is what
  # every plugin did before this service existed.
  exact-rank-cutoff: 0

  # Decimal places for percentile ranks.
  percent-decimal-places: 1
